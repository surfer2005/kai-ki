name: Mac-App bauen
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest        # Apple Silicon (M1–M4); feste Versionen werden von GitHub zurückgezogen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: App bauen
        run: |
          pyinstaller --noconfirm --windowed --name "KAI KI" --osx-bundle-identifier de.bsb.kai-ki \
            --collect-all pypdfium2 --hidden-import Vision --hidden-import Quartz --hidden-import Foundation --collect-submodules num2words start.py
          # Mikrofon (Chat-Reiter): ohne diese Beschreibung beendet macOS die App beim ersten Zugriff; danach neu (ad hoc) signieren
          plutil -insert NSMicrophoneUsageDescription -string "KAI KI nimmt Fragen per Mikrofon auf und erkennt sie auf diesem Mac (Whisper). Nichts verlässt das Gerät." "dist/KAI KI.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/KAI KI.app"
          VERSION=$(python -c "import kai_ki; print(kai_ki.__version__)")
          ditto -c -k --keepParent "dist/KAI KI.app" "KAI-KI-macOS-${VERSION}.zip"
          # Werkzeug zum Nachtrainieren (Weg 3) als eigene Datei
          chmod +x training/*.sh
          ditto -c -k --keepParent training "KAI-KI-Training-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KAI-KI-macOS-*.zip
            KAI-KI-Training-*.zip
          body: |
            KAI KI ${{ env.VERSION }} für Mac (Apple Silicon M1–M4).
            Entpacken, „KAI KI“ in den Ordner Programme ziehen, beim ersten Öffnen Rechtsklick → Öffnen (die App ist nicht bei Apple signiert).
            KAI-KI-Training: Werkzeug zum Nachtrainieren auf dem eigenen Mac (Anleitung in README.md im Ordner).
