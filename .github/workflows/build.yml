name: Mac-App bauen
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: App bauen
        run: |
          pyinstaller --noconfirm --windowed --name "KAI KI" --osx-bundle-identifier de.bsb.kai-ki \
            --collect-all pypdfium2 --hidden-import Vision --hidden-import Quartz --hidden-import Foundation start.py
          VERSION=$(python -c "import kai_ki; print(kai_ki.__version__)")
          ditto -c -k --keepParent "dist/KAI KI.app" "KAI-KI-macOS-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KAI-KI-macOS-*.zip
          body: |
            KAI KI ${{ env.VERSION }} für Mac (Apple Silicon M1–M4).
            Entpacken, „KAI KI“ in den Ordner Programme ziehen, beim ersten Öffnen Rechtsklick → Öffnen (die App ist nicht bei Apple signiert).
